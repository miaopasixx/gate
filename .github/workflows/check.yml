name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

env:
  CHECK_WORKER_BASE: "https://ccf.mpsxx.cc.cd/check?sstp=vpn:vpn@"
  CHECK_PROTO: "sstp"
  CHECK_CONCURRENCY: "32"
  CHECK_TIMEOUT: "90"
  CHECK_MODE: "worker"
  PROBE_TIMEOUT: "8"
  PUBLIC_DIR: "public"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, installing defaults"
            pip install aiohttp requests
          fi

      - name: Doctor - probe check worker
        id: doctor
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BASE="${CHECK_WORKER_BASE}"
          echo "probing: ${BASE}"

          WS_HOST="$(python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ.get("CHECK_WORKER_BASE", ""))
          print(u.hostname or "")
          PY
          )"
          echo "host: ${WS_HOST}"

          DNS_OK=false
          if [ -n "${WS_HOST}" ] && getent hosts "${WS_HOST}" >/dev/null 2>&1; then
            DNS_OK=true
            echo "DNS: OK"
            getent hosts "${WS_HOST}" || true
          else
            echo "DNS: FAIL"
          fi

          PROBE_URL="${BASE}1.1.1.1%3A443"
          CODE="000"
          for i in 1 2 3; do
            CODE="$(curl -sS --max-time 20 -o /tmp/probe.txt -w '%{http_code}' "${PROBE_URL}" 2>/dev/null || echo 000)"
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "${CODE}" != "000" ]; then
              break
            fi
            sleep 3
          done

          echo "----- body(head 400) -----"
          head -c 400 /tmp/probe.txt 2>/dev/null || true
          echo
          echo "--------------------------"

          JSON_OK=false
          if python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(Path("/tmp/probe.txt").read_text(encoding="utf-8"))
              valid = isinstance(data, dict) and isinstance(data.get("success"), bool)
          except Exception:
              valid = False
          raise SystemExit(0 if valid else 1)
          PY
          then
            JSON_OK=true
            echo "JSON contract: OK"
          else
            echo "JSON contract: FAIL"
          fi

          if [ "${DNS_OK}" = "true" ] && [ "${CODE}" = "200" ] && [ "${JSON_OK}" = "true" ]; then
            echo "worker_url=${BASE}" >> "$GITHUB_OUTPUT"
            echo "worker_ok=true"    >> "$GITHUB_OUTPUT"
            echo "RESULT: worker USABLE"
          else
            echo "worker_url="        >> "$GITHUB_OUTPUT"
            echo "worker_ok=false"    >> "$GITHUB_OUTPUT"
            echo "RESULT: worker UNUSABLE (dns_ok=${DNS_OK}, http=${CODE}, json_ok=${JSON_OK})"
          fi

      - name: Get VPN Gate nodes + check + build page
        id: collect
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ steps.doctor.outputs.worker_url }}
          CHECK_PROTO: ${{ env.CHECK_PROTO }}
          CHECK_CONCURRENCY: ${{ env.CHECK_CONCURRENCY }}
          CHECK_TIMEOUT: ${{ env.CHECK_TIMEOUT }}
          CHECK_MODE: ${{ env.CHECK_MODE }}
          PROBE_TIMEOUT: ${{ env.PROBE_TIMEOUT }}
          WORKER_OK: ${{ steps.doctor.outputs.worker_ok }}
          PUBLIC_DIR: ${{ env.PUBLIC_DIR }}

      - name: Validate publish artifacts
        id: validate
        run: python -c "import os, vpngate; count = vpngate.validate_public_dir(os.environ['PUBLIC_DIR']); print(f'validated {count} SSTP nodes')"

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-check-logs
          path: |
            ${{ env.PUBLIC_DIR }}
            result.csv
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        if: steps.collect.outcome == 'success' && steps.validate.outcome == 'success'
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        if: steps.collect.outcome == 'success' && steps.validate.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLIC_DIR }}

      - name: Deploy to GitHub Pages
        if: steps.collect.outcome == 'success' && steps.validate.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        shell: bash
        env:
          OUTCOME_COLLECT: ${{ steps.collect.outcome }}
          OUTCOME_VALIDATE: ${{ steps.validate.outcome }}
          OUTCOME_DEPLOY: ${{ steps.deployment.outcome }}
          WORKER_OK: ${{ steps.doctor.outputs.worker_ok }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          PAGE_URL="${PAGE_URL:-未获取}"
          DEPLOY_NOTE="已部署本轮通过校验的产物"
          if [ "${OUTCOME_DEPLOY}" != "success" ]; then
            DEPLOY_NOTE="本轮未部署；线上继续保留上一次成功版本"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## VPN Gate 检查结果

          | 项目 | 值 |
          | --- | --- |
          | 检测 Worker 可用 | \`${WORKER_OK}\` |
          | 采集脚本 | \`${OUTCOME_COLLECT}\` |
          | 产物校验 | \`${OUTCOME_VALIDATE}\` |
          | Pages 部署 | \`${OUTCOME_DEPLOY}\` |
          | 页面地址 | ${PAGE_URL} |

          ${DEPLOY_NOTE}
          EOF
