name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

env:
  # 只写到 /check 为止，查询参数由脚本自行拼接
  CHECK_WORKER_BASE: "https://ccf.mpsxx.cc.cd/check"
  CHECK_PROTO: "sstp"
  CHECK_CONCURRENCY: "32"
  CHECK_TIMEOUT: "90"
  PUBLIC_DIR: "public"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, installing defaults"
            pip install aiohttp requests
          fi

      - name: Doctor - probe check worker
        id: doctor
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BASE="${CHECK_WORKER_BASE}"
          echo "probing: ${BASE}"

          WS_HOST="$(python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlsplit(os.environ.get("CHECK_WORKER_BASE", ""))
          print(u.hostname or "")
          PY
          )"
          echo "host: ${WS_HOST}"

          DNS_OK=false
          if [ -n "${WS_HOST}" ] && getent hosts "${WS_HOST}" >/dev/null 2>&1; then
            DNS_OK=true
            echo "DNS: OK"
            getent hosts "${WS_HOST}" || true
          else
            echo "DNS: FAIL"
          fi

          PROBE_URL="${BASE}?proto=${CHECK_PROTO}&host=1.1.1.1&port=443"
          CODE="000"
          for i in 1 2 3; do
            CODE="$(curl -sS --max-time 20 -o /tmp/probe.txt -w '%{http_code}' "${PROBE_URL}" 2>/dev/null || echo 000)"
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "${CODE}" != "000" ]; then
              break
            fi
            sleep 3
          done

          echo "----- body(head 400) -----"
          head -c 400 /tmp/probe.txt 2>/dev/null || true
          echo
          echo "--------------------------"

          if [ "${DNS_OK}" = "true" ] && [ "${CODE}" = "200" ]; then
            echo "worker_url=${BASE}" >> "$GITHUB_OUTPUT"
            echo "worker_ok=true"    >> "$GITHUB_OUTPUT"
            echo "RESULT: worker USABLE"
          else
            echo "worker_url="        >> "$GITHUB_OUTPUT"
            echo "worker_ok=false"    >> "$GITHUB_OUTPUT"
            echo "RESULT: worker UNUSABLE (dns_ok=${DNS_OK}, http=${CODE}) -> fallback to local mode"
          fi

      - name: Get VPN Gate nodes + check + build page
        id: collect
        continue-on-error: true
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ steps.doctor.outputs.worker_url }}
          CHECK_PROTO: ${{ env.CHECK_PROTO }}
          CHECK_CONCURRENCY: ${{ env.CHECK_CONCURRENCY }}
          CHECK_TIMEOUT: ${{ env.CHECK_TIMEOUT }}
          # 为空表示 Worker 不可用，脚本应降级为本地直连检测
          WORKER_OK: ${{ steps.doctor.outputs.worker_ok }}
          PUBLIC_DIR: ${{ env.PUBLIC_DIR }}

      - name: Ensure public dir + fallback page
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PUBLIC_DIR}"

          if [ -f "${PUBLIC_DIR}/index.html" ]; then
            echo "index.html already generated by vpngate.py"
          else
            echo "[WARN] index.html missing, writing fallback page"
            OUTCOME="${{ steps.collect.outcome }}"
            WORKER_OK="${{ steps.doctor.outputs.worker_ok }}"
            STAMP="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            OUT_FILE="${PUBLIC_DIR}/index.html"
            export OUTCOME WORKER_OK STAMP OUT_FILE
            python3 - <<'PY'
          import os, html

          outcome = html.escape(os.environ.get("OUTCOME", "unknown"))
          worker_ok = html.escape(os.environ.get("WORKER_OK", "unknown"))
          stamp = html.escape(os.environ.get("STAMP", ""))
          path = os.environ["OUT_FILE"]

          doc = """<!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>VPN Gate Node Check</title>
          <style>
          body{{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
               background:#0f1115;color:#e6e6e6;margin:0;min-height:100vh;
               display:flex;align-items:center;justify-content:center;padding:24px}}
          .box{{max-width:600px;width:100%;padding:32px;border:1px solid #2a2f3a;
               border-radius:14px;background:#161a21;box-shadow:0 8px 32px rgba(0,0,0,.4)}}
          h1{{margin:0 0 14px;font-size:20px;color:#fbbf24}}
          p{{line-height:1.8;margin:8px 0;font-size:14px;color:#c9d1d9}}
          code{{background:#0b0e12;padding:2px 7px;border-radius:5px;color:#7dd3fc;
               font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}}
          .muted{{color:#6e7681;font-size:12px;margin-top:18px}}
          </style>
          </head>
          <body>
          <div class="box">
            <h1>本轮暂无可用节点</h1>
            <p>采集脚本未产出结果页面，这是自动生成的兜底页。</p>
            <p>采集步骤状态：<code>{outcome}</code></p>
            <p>检测 Worker 可用：<code>{worker_ok}</code></p>
            <p>生成时间：<code>{stamp}</code></p>
            <p class="muted">详细日志见仓库 Actions 页面本次运行的 doctor / collect 步骤。</p>
          </div>
          </body>
          </html>
          """.format(outcome=outcome, worker_ok=worker_ok, stamp=stamp)

          with open(path, "w", encoding="utf-8") as f:
              f.write(doc)
          print("fallback page written:", path)
          PY
          fi

          echo "----- ${PUBLIC_DIR} contents -----"
          ls -la "${PUBLIC_DIR}"
          echo "----- index.html size -----"
          wc -c "${PUBLIC_DIR}/index.html" || true

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-check-logs
          path: |
            ${{ env.PUBLIC_DIR }}
            result.csv
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnose Pages status
        id: pages_diag
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          echo "===== 1. 仓库可见性 ====="
          curl -sS "${AUTH[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('private =',d.get('private'));print('visibility =',d.get('visibility'));print('default_branch =',d.get('default_branch'))" \
            || echo "repo info failed"

          echo
          echo "===== 2. Pages 站点状态 ====="
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          CODE="$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${AUTH[@]}" "${API}")"
          echo "GET ${API} -> HTTP ${CODE}"
          cat /tmp/pages.json 2>/dev/null || true
          echo

          if [ "${CODE}" = "404" ]; then
            echo "===== 3. 尝试创建 Pages 站点 ====="
            CODE2="$(curl -sS -o /tmp/pages2.json -w '%{http_code}' -X POST "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${API}")"
            echo "POST -> HTTP ${CODE2}"
            cat /tmp/pages2.json 2>/dev/null || true
            echo
            case "${CODE2}" in
              201|204) echo "PAGES_CREATED=yes" >> "$GITHUB_OUTPUT" ;;
              403)     echo "PAGES_CREATED=no_token_permission" >> "$GITHUB_OUTPUT" ;;
              422)     echo "PAGES_CREATED=no_private_repo_support" >> "$GITHUB_OUTPUT" ;;
              *)       echo "PAGES_CREATED=no_http_${CODE2}" >> "$GITHUB_OUTPUT" ;;
            esac
            sleep 8
          elif [ "${CODE}" = "200" ]; then
            echo "PAGES_CREATED=already" >> "$GITHUB_OUTPUT"
          else
            echo "PAGES_CREATED=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLIC_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        shell: bash
        env:
          OUTCOME_COLLECT: ${{ steps.collect.outcome }}
          OUTCOME_DEPLOY: ${{ steps.deployment.outcome }}
          WORKER_OK: ${{ steps.doctor.outputs.worker_ok }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          PAGE_URL="${PAGE_URL:-未获取}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## VPN Gate 检查结果

          | 项目 | 值 |
          | --- | --- |
          | 检测 Worker 可用 | \`${WORKER_OK}\` |
          | 采集脚本 | \`${OUTCOME_COLLECT}\` |
          | Pages 部署 | \`${OUTCOME_DEPLOY}\` |
          | 页面地址 | ${PAGE_URL} |
          EOF
